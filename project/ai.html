<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" media="(min-width: 1100px) and (min-height: 600px)" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./image/b5c2a091-eb74-4b78-99dd-b52dc2a1dfe5.png" />
    <title>AI 推荐 · JMComic</title>
    <link rel="stylesheet" href="./style/app.css" />
    <link rel="stylesheet" href="./style/workspace.css" />
</head>
<body data-page="ai" class="">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <main class="app-main" id="main" tabindex="-1"><div class="page ai-page"><header class="page-head"><div><span class="eyebrow">从你的喜好出发</span><h1 class="page-title">为你推荐</h1><p class="page-lede">以7分为喜欢门槛，结合标题、评论与历史评分寻找下一本。</p></div><button class="btn btn-outline" type="button" data-open-account="llm">配置 AI 接口</button></header>
<div class="ai-layout"><aside class="ai-preferences"><section class="section"><div class="section-head"><h2 class="section-title">你的偏好</h2><button class="btn btn-ghost btn-sm generate-profile" type="button">重新计算偏好</button></div><dl class="stat-grid"><div><dt>收藏</dt><dd data-stat="favorites">—</dd></div><div><dt>评价</dt><dd data-stat="rated">—</dd></div><div><dt>标签反馈</dt><dd data-stat="tag_feedback">—</dd></div><div><dt>阅读互动</dt><dd data-stat="interactions">—</dd></div></dl><div class="profile-content"></div><p class="profile-state status-line" role="status"></p></section><section class="section"><div class="section-head"><h2 class="section-title">推荐历史</h2></div><div class="recommend-history"></div></section></aside>
<div class="ai-main"><section class="panel"><div class="section-head"><h2 class="section-title">寻找下一本</h2></div><form class="recommend-form">
<label class="switch"><input type="checkbox" name="random_mode" /><span class="switch-copy"><strong>随机探索</strong><small>从随机有效编号中寻找新作品</small></span></label>
<div class="recommend-fields"><label class="field field-wide" data-recommend-filter><span class="field-label">关键词</span><input class="input" name="keyword" type="search" placeholder="作品、作者或标签（可留空）" /></label>
<label class="field" data-recommend-filter><span class="field-label">分类</span><select class="input" name="category"><option value="0">全部</option></select></label><label class="field" data-recommend-filter><span class="field-label">副分类</span><select class="input" name="subcategory"><option value="">全部</option></select></label>
<label class="field" data-recommend-filter><span class="field-label">排序</span><select class="input" name="order"><option value="mv">最多观看</option><option value="mr">最新发布</option><option value="tf">最多喜欢</option><option value="mp">最多图片</option></select></label><label class="field" data-recommend-filter><span class="field-label">时间</span><select class="input" name="time"><option value="a">全部</option><option value="t">今日</option><option value="w">本周</option><option value="m">本月</option></select></label>
<label class="field"><span class="field-label">候选数量</span><input class="input" name="candidate_count" type="number" min="1" max="300" value="50" inputmode="numeric" required /></label><label class="field"><span class="field-label">推荐数量</span><input class="input" name="limit" type="number" min="1" max="100" value="10" inputmode="numeric" required /></label></div>
<div class="recommend-options"><label class="switch"><input type="checkbox" name="hide_serial" /><span>只看单章</span></label><label class="switch"><input type="checkbox" name="limit_all" /><span>返回全部候选</span></label></div>
<label class="field"><span class="field-label">本次内容分析上限（本）</span><input class="input" name="content_budget" type="number" min="0" max="500" value="48" /><small>同时补充历史评分样本与候选，缓存可复用；设为0只使用已有证据。</small></label><p class="picker-note">配置语言模型后，每本未缓存作品最多调用一次接口，可能产生费用。7分是喜欢门槛；缺少评论仍可推荐，推荐分不是概率。</p><button class="btn btn-primary generate-recommendations" type="submit">筛选并生成推荐</button><button class="btn btn-outline cancel-recommendations" type="button" hidden>停止</button><p class="recommend-state status-line" role="status"></p></form></section>
<section class="section recommend-output"><div class="section-head"><h2 class="section-title">推荐结果</h2></div><div class="recommend-results"><div class="state"><strong class="state-title">下一本，从这里开始</strong><p class="state-message">设置条件生成推荐，或打开一条历史记录。</p></div></div></section></div></div></div></main>
    <script type="module" src="./src/pages/ai.js"></script>
</body>
</html>
