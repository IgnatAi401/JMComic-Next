<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" media="(min-width: 1100px) and (min-height: 600px)" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./image/logo-64.png" />
    <title>书架 · JMComic</title>
    <link rel="stylesheet" href="./style/app.css" />
    <link rel="stylesheet" href="./style/workspace.css" />
</head>
<body data-page="library" class="">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <main class="app-main" id="main" tabindex="-1"><div class="page library-page">
        <header class="page-head is-compact"><h1 class="page-title">书架</h1></header>
        <nav class="view-tabs library-tabs" aria-label="书架视图"><button type="button" data-view="favorites">收藏</button><button type="button" data-view="ratings">评分</button><button type="button" data-view="history">最近阅读</button><button type="button" data-view="later">稍后再看</button><button type="button" data-view="random">随机历史</button></nav>
        <div class="list-toolbar">
            <select class="select toolbar-select folder-select" aria-label="收藏夹" hidden></select>
            <select class="select toolbar-select rating-select" aria-label="按评分筛选" hidden></select>
            <span class="toolbar-status library-notice" role="status"></span>
            <div class="toolbar-actions"><button class="icon-btn sync-btn" type="button" aria-label="同步收藏" title="同步收藏" hidden></button></div>
        </div>
        <div class="comic-grid library-grid"></div>
        <div class="feed-footer"><button type="button" class="btn btn-outline load-more" hidden>加载更多</button></div>
    </div></main>
    <script type="module" src="./src/pages/library.js"></script>
</body>
</html>
