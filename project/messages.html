<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" media="(min-width: 1100px) and (min-height: 600px)" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./image/logo-64.png" />
    <title>消息与追更 · JMComic</title>
    <link rel="stylesheet" href="./style/app.css" />
    <link rel="stylesheet" href="./style/workspace.css" />
</head>
<body data-page="messages" class="">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <main class="app-main" id="main" tabindex="-1"><div class="page messages-page"><header class="page-head"><div class="page-head-copy"><h1 class="page-title">消息与追更</h1><p class="page-lede message-status" role="status">正在读取账号消息…</p></div><button type="button" class="btn btn-outline btn-sm refresh-messages">刷新</button></header><nav class="segmented is-block messages-tabs" aria-label="消息视图"><button type="button" data-messages-tab="notifications" aria-pressed="true">通知<span class="tab-count notification-total">0</span></button><button type="button" data-messages-tab="tracking" aria-pressed="false">正在追更<span class="tab-count tracking-total">0</span></button></nav><div class="messages-layout" data-tab="notifications"><section class="section notification-section"><div class="section-head"><h2 class="section-title">通知</h2><span class="section-meta notification-total">0</span></div><div class="notification-list"></div></section><section class="section tracking-section"><div class="section-head"><h2 class="section-title">正在追更</h2><span class="section-meta tracking-total">0</span></div><div class="tracking-list"></div><div class="feed-footer"><button class="btn btn-outline tracking-more" type="button" hidden>加载更多连载</button></div></section></div></div></main>
