<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0e" media="(min-width: 1100px) and (min-height: 600px)" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="./image/b5c2a091-eb74-4b78-99dd-b52dc2a1dfe5.png" />
    <title>迁移历史 · JMComic</title>
    <link rel="stylesheet" href="./style/app.css" />
    <link rel="stylesheet" href="./style/workspace.css" />
</head>
<body data-page="history-migration" class="">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <main class="app-main" id="main" tabindex="-1"><div class="page history-migration-page">
<header class="page-head"><div><span class="eyebrow">浏览器历史</span><h1 class="page-title">迁移历史</h1><p class="page-lede">将当前网址下的旧历史合并到本地资料库。较新记录优先，成功后才移除旧记录，失败可重试。</p></div></header>
<section class="panel measure"><h2 class="panel-title">当前浏览器</h2><p class="status-line" role="status" data-migration-status>等待迁移</p><dl class="stat-grid"><div><dt>阅读历史</dt><dd data-reading-count>—</dd></div><div><dt>随机历史</dt><dd data-random-count>—</dd></div></dl><div class="page-actions"><button class="btn btn-primary" type="button" data-migrate>迁移并刷新</button><a class="btn btn-outline" href="./library.html?view=history" data-navigation="same-tab">查看历史</a></div><p class="picker-note">每个浏览器、域名和端口都有独立的旧历史，需要在原来的地址分别迁移。</p></section></div></main>
    <script type="module" src="./src/pages/history-migration.js"></script>
</body>
</html>
